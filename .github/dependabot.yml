version: 2
updates:
  # Monorepo npm dependencies (root pnpm-lock.yaml covers every workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The Expo mobile app is the frozen pre-pivot prototype, kept for
      # reference only: its dependencies are deliberately not tracked.
      # The legacy Expo push channel follows the same rule until the
      # web-push migration (#8) retires it.
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native*"

  # Keep the CI actions themselves up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "ci"
