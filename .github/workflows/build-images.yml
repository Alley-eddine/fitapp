name: Build & push service images

# Build the five service images on GitHub's runners and push them to GHCR, so
# the VPS only pulls ready-made images instead of building them (which starves
# a small server of RAM). Runs on main and on demand.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, api, ai, notifications, payment, postgres]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/alley-eddine/fitapp-${{ matrix.service }}:latest
            ghcr.io/alley-eddine/fitapp-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
